s":12},{"names":["macos","mac","mac os"],"pts":10},{"names":["ubuntu"],"pts":28},{"names":["chrome os","chromeos"],"pts":55},{"names":["word"],"pts":10},{"names":["excel"],"pts":12},{"names":["powerpoint"],"pts":15},{"names":["photoshop"],"pts":25},{"names":["visual studio","vs code","vscode"],"pts":30},{"names":["minecraft"],"pts":25},{"names":["chrome","google chrome"],"pts":8},{"names":["firefox"],"pts":22},{"names":["zoom"],"pts":40},{"names":["unix"],"pts":80},{"names":["debian"],"pts":85},{"names":["fedora"],"pts":95},{"names":["blender"],"pts":65},{"names":["autocad"],"pts":70},{"names":["gimp"],"pts":80},{"names":["steam"],"pts":40},{"names":["teams","microsoft teams"],"pts":45},{"names":["outlook"],"pts":50},{"names":["access"],"pts":90},{"names":["paint"],"pts":20},{"names":["notepad","beležnica"],"pts":30},{"names":["chatgpt","claude"],"pts":25},{"names":["edge"],"pts":35},{"names":["safari"],"pts":30},{"names":["discord"],"pts":20}]}]}],"OSTALI_TOCKE":15,"SOLA":{"ime":"Višja strokovna šola L.I.V.E.","geslo":"Prva višja strokovna šola","logo":"https://prometna.net/visja-sola/wp-content/themes/prometna/images/logo-visja-sola.png","poziv":"Všeč ti je bilo? Pridi študirat na L.I.V.E. – obišči našo stojnico ali piši na referat@vpsmb.eu!"}};
</script>
<script>
const { CATEGORIES, OSTALI_TOCKE, SOLA } = DATA;
const CFG = { rounds: 5, answerSec: 20, introSec: 3, revealSec: 9, resultSec: 35 };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- ujemanje odgovorov ---------- */
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9+#/ ]/g, ' ').replace(/\s+/g, ' ').trim();
function lev(a, b) { let p = Array.from({length:b.length+1},(_,i)=>i); for (let i=1;i<=a.length;i++){ const c=[i]; for(let j=1;j<=b.length;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[b.length]; }
for (const c of CATEGORIES) for (const q of c.questions) for (const a of q.answers) { a.n = a.names.map(norm); a.label = a.names[0]; }
const listed = (q,i) => ({ kind:'listed', pts:q.answers[i].pts, label:q.answers[i].label });
function matchAnswer(q, raw) {
  const t = norm(raw || '');
  if (!t.replace(/[^a-z0-9]/g,'')) return { kind:'empty', pts:0, label:'—' };
  for (let i=0;i<q.answers.length;i++) if (q.answers[i].n.includes(t)) return listed(q,i);
  if (t.length >= 5) { let best=null; q.answers.forEach((a,i)=>a.n.forEach(nm=>{ if(nm.length<5) return; const d=lev(t,nm), lim=nm.length>=9?2:1; if(d<=lim&&(!best||d<best.d)) best={i,d}; })); if (best) return listed(q,best.i); }
  let f=null; q.answers.forEach((a,i)=>a.n.forEach(nm=>{ if(nm.length>=4 && (' '+t+' ').includes(' '+nm+' ') && (!f||nm.length>f.len)) f={i,len:nm.length}; })); if (f) return listed(q,f.i);
  return { kind:'original', pts:OSTALI_TOCKE, label:raw.trim().slice(0,40) };
}
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* ---------- lestvica ---------- */
let highs = []; try { highs = JSON.parse(localStorage.getItem('kd_highs') || '[]'); } catch(e) {}
const saveHighs = () => { try { localStorage.setItem('kd_highs', JSON.stringify(highs)); } catch(e) {} };

/* ---------- zvok ---------- */
let actx = null, muted = false; try { muted = localStorage.getItem('kd_mute') === '1'; } catch(e) {}
$('#snd').textContent = muted ? '🔇' : '🔊';
function tone(f, d=.15, type='sine', vol=.12, delay=0) {
  if (muted) return; try { actx = actx || new (window.AudioContext||window.webkitAudioContext)(); } catch(e) { return; }
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + .02);
}
const sfx = {
  start: () => [440,554,659].forEach((f,i)=>tone(f,.18,'triangle',.12,i*.09)),
  tick: () => tone(880,.06,'square',.05),
  submit: () => tone(520,.1,'triangle',.12),
  reveal: pts => { const n = pts>=60?5:pts>=25?3:1; for(let i=0;i<n;i++) tone(500+i*(pts>=60?120:70),.2,'triangle',.13,i*.08); if (!pts) tone(150,.3,'sawtooth',.08); },
  fanfare: () => [523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.14,i*.12)),
};
$('#snd').onclick = () => { muted = !muted; try { localStorage.setItem('kd_mute', muted?'1':'0'); } catch(e) {} $('#snd').textContent = muted ? '🔇' : '🔊'; if (!muted) sfx.submit(); };
$('#fs').onclick = toggleFs; function toggleFs() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }

/* ---------- ozadje ---------- */
const scene = $('#scene');
for (let i=0;i<30;i++){ const b=document.createElement('i'); b.className='bub'; const s=6+Math.random()*20; b.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${8+Math.random()*14}s;animation-delay:-${Math.random()*20}s`; scene.appendChild(b); }
['🐟','🐠','🐡','🦑','🐙','🐢'].forEach((e,i)=>{ const f=document.createElement('div'); f.className='fish'; f.textContent=e; f.style.cssText=`top:${18+i*13}%;animation-duration:${26+i*7}s;animation-delay:-${i*9}s;${i%2?'transform:scaleX(-1)':''}`; scene.appendChild(f); });
const setDepth = p => document.documentElement.style.setProperty('--depth', Math.max(0, Math.min(1, p)));

/* ---------- delci (canvas) ---------- */
const cv = $('#fx'), cx = cv.getContext('2d'); let parts = [], raf = 0;
const fit = () => { cv.width = innerWidth; cv.height = innerHeight; }; addEventListener('resize', fit); fit();
function burst(x, y, n, color) {
  for (let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=2+Math.random()*7; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,r:3+Math.random()*7,life:1,c:color||['#fde68a','#38b6f0','#a78bfa','#34d399'][i%4]}); }
  if (!raf) loop();
}
function loop() {
  cx.clearRect(0,0,cv.width,cv.height);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) { p.x+=p.vx; p.y+=p.vy; p.vy+=.12; p.life-=.014; cx.globalAlpha=Math.max(0,p.life); cx.fillStyle=p.c; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7); cx.fill(); }
  cx.globalAlpha = 1;
  raf = parts.length ? requestAnimationFrame(loop) : 0;
}
function floatPts(text, x, y) { const e=document.createElement('div'); e.className='floatpts'; e.textContent=text; e.style.left=(x-60)+'px'; e.style.top=y+'px'; document.body.appendChild(e); setTimeout(()=>e.remove(),1700); }
function countUp(el, to, ms, suffix='') { const t0=performance.now(); const step=t=>{ const k=Math.min(1,(t-t0)/ms); el.textContent=Math.round(to*(1-Math.pow(1-k,3)))+suffix; if(k<1) requestAnimationFrame(step); }; requestAnimationFrame(step); }

/* ---------- stanje igre ---------- */
let G = null, timers = [], tickRaf = 0, lastName = '';
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(tickRaf); };
const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
const MAXPTS = CFG.rounds * 60;
const stage = $('#stage');
$('#logo').src = SOLA.logo;

function setGauge(total) {
  $('#diver').style.top = (30 + Math.min(1, total/MAXPTS) * (innerHeight - 74 - 60 - 130)) + 'px';
  $('#ddp').innerHTML = total*10 + ' <small>m</small>';
  setDepth(total/MAXPTS);
  const rec = $('#rec');
  if (highs.length) { rec.style.display=''; rec.textContent='🏆 ' + highs[0].total*10 + ' m'; rec.style.top = (30 + Math.min(1, highs[0].total/MAXPTS) * (innerHeight - 74 - 60 - 130) + 90) + 'px'; } else rec.style.display='none';
}

function showStart() {
  clearTimers(); G = null; document.body.classList.remove('ingame'); setDepth(0); window._focusAns = null;
  const rows = highs.slice(0, 8).map((h,i)=>`<li><span class="rk">${['🥇','🥈','🥉'][i]||i+1+'.'}</span><span class="nm">${esc(h.name)}</span><span>${CATEGORIES.find(c=>c.ime===h.cat)?.emoji||''}</span><span class="dp">${h.total*10} m</span></li>`).join('');
  stage.innerHTML = `<div class="panel"><div class="start"><div>
      <h1>Kako <em>globoko</em> znaš zaplavati?</h1>
      <p class="sub">Napiši čim <b>redkejši</b> odgovor – več točk, globlji potop! 🤿</p>
      <input id="nm" class="txt" maxlength="14" placeholder="Tvoje ime" value="${esc(lastName)}" autocomplete="off">
      <p class="sub" style="margin:16px 0 0">Izberi svojo smer in začni:</p>
      <div class="cats">${CATEGORIES.map(c=>`<button class="cat" style="--c:${c.barva}" data-id="${c.id}"><span class="em">${c.emoji}</span>${esc(c.ime)}</button>`).join('')}</div>
    </div><div class="board"><h3>🏆 Najgloblji potopi</h3>${rows ? '<ol>'+rows+'</ol>' : '<div class="empty">Lestvica je še prazna.<br>Bodi prvi!</div>'}</div></div></div>`;
  stage.querySelectorAll('.cat').forEach(b => b.onclick = () => startGame(b.dataset.id));
  $('#nm').focus();
}

function startGame(catId) {
  if (actx && actx.state === 'suspended') actx.resume();
  lastName = ($('#nm').value || '').trim().slice(0, 14);
  const cat = CATEGORIES.find(c => c.id === catId);
  G = { cat, name: lastName || 'Igralec', qs: shuffle(cat.questions).slice(0, CFG.rounds), round: 0, total: 0, state: 'intro' };
  document.body.classList.add('ingame');
  $('#dnm').textContent = G.name; setGauge(0); sfx.start();
  document.documentElement.style.setProperty('--acc', cat.barva);
  stage.innerHTML = `<div class="panel"><div class="big">${cat.emoji}</div><h1>${esc(cat.ime)}</h1>
    <p class="sub">Napiši <b>čim redkejši</b> odgovor. Enak odgovor kot vsi? Malo točk. Nekaj posebnega? Veliko!</p><div class="count" id="cd">3</div></div>`;
  let n = CFG.introSec; sfx.tick();
  const t = setInterval(() => { n--; if (n <= 0) { clearInterval(t); askQuestion(); } else { $('#cd') && ($('#cd').textContent = n); sfx.tick(); } }, 1000);
  timers.push(t);
}

const dots = () => `<div class="dots">${Array.from({length:CFG.rounds},(_,i)=>`<i class="${i<G.round?'done':i===G.round?'cur':''}"></i>`).join('')}</div>`;

function askQuestion() {
  G.state = 'question'; const q = G.qs[G.round]; let submitted = false;
  stage.innerHTML = `<div class="panel">${dots()}<div class="qmeta">${G.cat.emoji} ${esc(G.cat.ime)} · vprašanje ${G.round+1}/${CFG.rounds}</div>
    <div class="qtext">${esc(q.q)}</div><div class="timer" id="tm"><b></b></div><div class="secs" id="secs">${CFG.answerSec}</div>
    <input id="ans" class="txt" maxlength="40" placeholder="Vpiši odgovor in pritisni Enter" autocomplete="off">
    <button class="btn" id="sub">Oddaj</button><div class="hint">Namig: pomisli na nekaj, česar drugi ne bi napisali 😉</div></div>`;
  const inp = $('#ans'); inp.focus();
  const end = () => { if (submitted) return; submitted = true; cancelAnimationFrame(tickRaf); sfx.submit(); reveal(q, inp.value); };
  $('#sub').onclick = end; inp.onkeydown = e => { if (e.key === 'Enter') end(); };
  const t0 = performance.now(); let lastSec = CFG.answerSec;
  const tick = () => {
    const left = Math.max(0, CFG.answerSec - (performance.now() - t0) / 1000);
    const b = $('#tm b'); if (!b) return;
    b.style.width = (left / CFG.answerSec * 100) + '%'; $('#tm').classList.toggle('low', left < 5);
    const s = Math.ceil(left); if (s !== lastSec) { lastSec = s; $('#secs').textContent = s; if (s <= 5 && s > 0) sfx.tick(); }
    if (left <= 0) end(); else tickRaf = requestAnimationFrame(tick);
  };
  tick();
}

function reveal(q, text) {
  G.state = 'reveal';
  const r = matchAnswer(q, text); G.total += r.pts;
  const rarest = q.answers.slice().sort((a,b)=>b.pts-a.pts).slice(0,4);
  const pct = r.kind === 'empty' ? 0 : Math.min(100, r.pts);
  const tag = r.kind==='empty' ? 'Brez odgovora ⏱' : r.kind==='original' ? 'Izviren odgovor ✨' : r.pts>=60 ? 'Zelo redek odgovor! 💎' : r.pts>=35 ? 'Redek odgovor! 👏' : r.pts>=13 ? 'Dokaj običajen' : 'Preveč običajno … 🙈';
  const last = G.round === CFG.rounds - 1;
  stage.innerHTML = `<div class="panel">${dots()}<div class="qmeta">${esc(q.q)}</div>
    <div class="reveal"><div class="ans">${esc(r.kind==='empty'?'—':r.kind==='listed'?r.label:text.trim())}</div>
      <div class="pts" id="pts">0</div><div class="tag">${tag}</div>
      <div class="meter"><i id="mk"></i></div><div class="mlab"><span>pogosto</span><span>redko</span><span>zelo redko</span></div></div>
    <div class="rare">💎 Najredkejši odgovori: ${rarest.map(x=>`<b>${esc(x.label)}</b> (${x.pts})`).join(' · ')}</div>
    <button class="btn" id="next">${last ? 'Poglej rezultat →' : 'Naprej →'}</button><div class="hint">Enter = naprej</div></div>`;
  sfx.reveal(r.pts); setTimeout(() => { const m = $('#mk'); if (m) m.style.left = `calc(${pct}% - 4px)`; }, 80);
  countUp($('#pts'), r.pts, 900, '');
  const rc = $('.reveal').getBoundingClientRect();
  if (r.pts >= 35) { burst(rc.left + rc.width/2, rc.top + 90, r.pts >= 60 ? 90 : 40); floatPts('+' + r.pts, rc.left + rc.width/2, rc.top); }
  setGauge(G.total);
  const go = () => { cancelAnimationFrame(tickRaf); G.round++; if (G.round >= CFG.rounds) finish(); else askQuestion(); };
  $('#next').onclick = go; G.next = go; later(go, CFG.revealSec * 1000);
}

function finish() {
  G.state = 'result'; clearTimers(); document.body.classList.remove('ingame');
  highs.push({ name: G.name, total: G.total, cat: G.cat.ime, t: Date.now() });
  highs.sort((a,b)=>b.total-a.total || a.t-b.t); highs = highs.slice(0, 10);
  const rank = highs.findIndex(h => h.t && h.name === G.name && h.total === G.total && h.cat === G.cat.ime && Date.now() - h.t < 5000) + 1;
  saveHighs(); sfx.fanfare();
  const rows = highs.slice(0, 8).map((h,i)=>`<li class="${rank===i+1?'me':''}"><span class="rk">${['🥇','🥈','🥉'][i]||i+1+'.'}</span><span class="nm">${esc(h.name)}</span><span>${CATEGORIES.find(c=>c.ime===h.cat)?.emoji||''}</span><span class="dp">${h.total*10} m</span></li>`).join('');
  const head = rank === 1 ? 'Nov rekord!' : rank > 0 ? rank + '. mesto na lestvici!' : 'Potop končan!';
  stage.innerHTML = `<div class="panel"><div class="res"><div>
      <div class="medal">${rank===1?'🏆':rank===2?'🥈':rank===3?'🥉':'🤿'}</div><h2>${esc(head)}</h2>
      <div class="depthbig" id="db">0</div><div class="sub" style="margin-top:0">${esc(G.name)} je zaplaval/a do globine</div>
      <div class="fact">${esc(G.cat.dejstvo)}</div><div class="cta">${esc(SOLA.poziv)}</div>
      <button class="btn" id="again">Nov potop 🔁</button><div class="auto"><b id="ab"></b></div></div>
    <div class="board"><h3>🏆 Najgloblji potopi</h3><ol>${rows}</ol></div></div></div>`;
  countUp($('#db'), G.total * 10, 1400, ' m');
  setTimeout(() => { if (rank >= 1 && rank <= 3 || G.total >= 150) { burst(innerWidth/2, innerHeight/2, 140); burst(innerWidth*.3, innerHeight*.4, 60); burst(innerWidth*.7, innerHeight*.4, 60); } }, 400);
  $('#again').onclick = () => { lastName = ''; showStart(); };
  const t0 = performance.now(), tick = () => { const k = 1 - (performance.now()-t0)/(CFG.resultSec*1000); const b=$('#ab'); if(!b) return; b.style.width=Math.max(0,k*100)+'%'; if (k <= 0) { lastName=''; showStart(); } else tickRaf = requestAnimationFrame(tick); };
  tick();
}

/* ---------- tipkovnica ---------- */
addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') { if (!(document.activeElement && document.activeElement.tagName === 'INPUT')) toggleFs(); }
  if (G && G.state === 'reveal' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); const n = G.next; G.next = null; n && n(); return; }
  // če polje za vpis ni v fokusu, ga ujemi in vnesi črko
  const a = document.activeElement, inp = $('#ans') || $('#nm');
  if (inp && a !== inp && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { inp.focus(); }
});
$('#clr').onclick = () => { if (confirm('Izbrišem celotno lestvico?')) { highs = []; saveHighs(); if (!G) showStart(); } };
document.addEventListener('visibilitychange', () => { if (actx && actx.state === 'suspended') actx.resume(); });
showStart();
</script>
</body>
