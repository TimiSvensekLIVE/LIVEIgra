function lev(a,b){ const d=[]; for(let i=0;i<=a.length;i++){ d[i]=[i]; } for(let j=0;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++){ const c=a[i-1]===b[j-1]?0:1; d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c); if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1); }

  // voda po pasovih
  const top=Math.max(0,surf);
  for(let y=top;y<lh;y+=2){ g.fillStyle=rgb(waterRGB(dM(y))); g.fillRect(0,y,lw,2); }
  // valovanje
  if (surf>-4 && surf<lh) { const c0=waterRGB(0); for(let x=0;x<lw;x++){ const ty=surf+Math.round(Math.sin(x*.07+t*1.3)*1.5+Math.sin(x*.19-t*1.7)*.8); g.fillStyle=rgb(c0); g.fillRect(x,ty,1,3-(ty-surf)); g.fillStyle='rgba(215,245,255,.85)'; g.fillRect(x,ty,1,1); } }
  // svetlobni žarki
  const sh=Math.max(0,1-Math.max(0,W.depth)/350 - Math.max(0,(cam)/(lh*2)));
  if (sh>0 && surf<lh) { g.fillStyle=`rgba(255,255,255,${.06*sh})`; for(let k=0;k<6;k++){ const bx=((k*83+ t*3)%(lw+80))-40; g.beginPath(); g.moveTo(bx,Math.max(0,surf)); g.lineTo(bx+14,Math.max(0,surf)); g.lineTo(bx-40,lh); g.lineTo(bx-62,lh); g.fill(); } }

  // ladja
  if (surf>-30 && surf<lh+10) { const bx=Math.round(lw*(W.mode==='start'?.22:.1) + Math.sin(t*.5)*4); g.drawImage(SP.boat, bx, Math.round(surf-SP.boat.height+3+Math.sin(t*1.3)*1)); }

  // ribe in globinska bitja
  const B=34, b0=Math.floor((cam-30)/B), b1=Math.floor((cam+lh+30)/B);
  for(let b=b0;b<=b1;b++){ if(b*B<14) continue;
    for(let k=0;k<2;k++){ if(h1(b,k)>.6) continue;
      const wy=b*B+h1(b,k+9)*B, d=wy/PXM, dir=h1(b,k+5)>.5?1:-1, sp=4+h1(b,k+6)*10, span=lw+70;
      const x=((h1(b,k+3)*span + t*sp*dir)%span+span)%span-35, y=Math.round(wy-cam); let s;
      if (d>1100 && h1(b,k+7)>.5) { s=dir>0?SP.angler:SP.anglerf; glow(x+(dir>0?12:4),y,22,'rgba(255,229,138,A)',.35); }
      else if (d>550 && h1(b,k+7)>.35) { s=SP.jelly; y2: { const yy=y+Math.round(Math.sin(t*2+b)*3); glow(x+4,yy+3,18,'rgba(200,96,255,A)',.3); g.drawImage(s,Math.round(x),yy); } continue; }
      else if (d>220 && h1(b,k+7)>.5) s=SP.squid;
      else s = h1(b,k+8)>.45 ? (dir>0?SP.fishM:SP.fishMf) : (dir>0?SP.fishS:SP.fishSf);
      g.globalAlpha=Math.max(.35,.7-d/3000); g.drawImage(s,Math.round(x),y); g.globalAlpha=1;
    }
  }
  // morski sneg
  if (W.depth>15 || cam>-lh*.3) { g.fillStyle='rgba(200,230,255,.35)'; for(let i=0;i<50;i++){ const x=(h1(i)*lw+Math.sin(t+i)*3+lw)%lw, y=((h1(i,2)*lh*3 - cam*.5 + t*3)%lh+lh)%lh; if(y>surf+3) g.fillRect(Math.round(x),Math.round(y),1,1); } }

  // rekord (zlata črta)
  if (highs.length && W.mode!=='start') { const ry=Math.round(highs[0].total*10*PXM - cam + 20); if(ry>0&&ry<lh){ g.fillStyle='#ffd86b'; for(let x=0;x<lw;x+=6) g.fillRect(x,ry,3,1); g.fillRect(lw-14,ry-4,8,4); g.fillRect(lw-12,ry,4,2); } }
  // ravnilo
  if (W.mode!=='start') { for(let m=0;m<=6000;m+=50){ const y=Math.round(m*PXM-cam+20); if(y<-2||y>lh+2) continue; g.fillStyle=m%250===0?'rgba(255,255,255,.55)':'rgba(255,255,255,.25)'; g.fillRect(lw-(m%250===0?9:5),y,m%250===0?9:5,1); } g.fillStyle='rgba(255,255,255,.2)'; g.fillRect(lw-1,0,1,lh); }

  // kozica
  const kx=Math.round(lw*W.kx), ky=Math.round(kyW-cam+Math.sin(t*2)*1.5);
  if (!(W.mode==='start' && false)) {
    glow(kx+6,ky+3,20,'rgba(255,61,90,A)',.4);
    const kr = W.mode==='start' ? SP.krillf : SP.krill; g.drawImage(kr,kx,ky);
    if (Math.random()<.05) bubs.push({x:kx+(W.mode==='start'?8:2),y:kyW,life:1});
  }
  bubs=bubs.filter(b=>b.life>0); for(const b of bubs){ b.y-=.25; b.life-=.01; g.fillStyle=`rgba(220,245,255,${b.life*.6})`; g.fillRect(Math.round(b.x+Math.sin(b.y*.3)),Math.round(b.y-cam),1,1); }

  // delci
  parts=parts.filter(p=>p.life>0); for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=.06; p.life-=.015; g.globalAlpha=Math.max(0,p.life); g.fillStyle=p.c; g.fillRect(Math.round(p.x),Math.round(p.y),2,2); } g.globalAlpha=1;
  // tema ob robovih (vinjeta) – globlje bolj
  const vg=Math.min(.55, W.depth/6000); if (vg>.02) { const gr=g.createRadialGradient(lw/2,lh/2,lh*.35,lw/2,lh/2,lw*.7); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,`rgba(0,0,0,${vg})`); g.fillStyle=gr; g.fillRect(0,0,lw,lh); }

  // HUD
  $('#hd').textContent = Math.round(W.depth) + ' m';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function floatPts(text,x,y){ const e=document.createElement('div'); e.className='float'; e.textContent=text; e.style.left=(x-50)+'px'; e.style.top=y+'px'; document.body.appendChild(e); setTimeout(()=>e.remove(),1600); }
function countUp(el,to,ms,prefix='',suffix=''){ const t0=performance.now(); const step=t=>{ const k=Math.min(1,(t-t0)/ms); el.textContent=prefix+Math.round(to*(1-Math.pow(1-k,3)))+suffix; if(k<1) requestAnimationFrame(step); }; requestAnimationFrame(step); }

/* ============ igra ============ */
let G=null, timers=[], tickRaf=0, lastName='', selCat=null;
const clearTimers=()=>{ timers.forEach(t=>{clearTimeout(t);clearInterval(t);}); timers=[]; cancelAnimationFrame(tickRaf); };
const later=(fn,ms)=>{ const t=setTimeout(fn,ms); timers.push(t); return t; };
const lbRows=(rank=0,n=6)=>highs.slice(0,n).map((h,i)=>`<li class="${rank===i+1?'me':''}"><span class="rk">${i+1}.</span><span class="n">${esc(h.name)}</span><span class="d">${h.total*10} m</span></li>`).join('');

function showStart(){
  clearTimers(); G=null; W.mode='start'; W.target=0; document.body.classList.remove('ingame');
  ui.innerHTML = `
   <div class="hero"><div class="title" data-t="KRILL DIVE">KRILL DIVE</div><div class="sub1">POTOP ZNANJA</div>
     <div class="sub2">5 vprašanj · 20 sekund · redkejši odgovori potonijo globlje</div></div>
   <div class="lb px"><span class="chip tagc">Lestvica</span><h3>&nbsp;</h3>${highs.length?'<ol>'+lbRows(0,7)+'</ol>':'<div class="empty">Lestvica je še prazna.<br>Bodi prvi!</div>'}</div>
   <div class="dock"><input id="nm" class="name" maxlength="14" placeholder="Tvoje ime" value="${esc(lastName)}" autocomplete="off">
     <div class="catgrid">${CATEGORIES.map(c=>`<button class="cat px ${selCat===c.id?'sel':''}" data-id="${c.id}"><img class="ic" src="${iconUrl(c.id)}" alt=""><div><div class="nm">${esc(c.ime)}</div><small>${catBest(c.ime)?'Rekord '+catBest(c.ime)*10+' m':'Še nihče'}</small></div></button>`).join('')}</div>
     <button id="go" class="bigbtn px" ${selCat?'':'disabled'}>${selCat?'▼ Začni potop ▼':'▼ Izberi smer ▼'}</button></div>`;
  ui.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{ lastName=$('#nm').value; selCat=b.dataset.id; sfx.tick(); showStart(); setTimeout(()=>$('#go').focus(),0); });
  $('#go').onclick=()=>selCat&&startGame(selCat);
  $('#nm').focus();
}

function startGame(catId){
  if(actx&&actx.state==='suspended') actx.resume();
  lastName=($('#nm').value||'').trim().slice(0,14);
  const cat=CATEGORIES.find(c=>c.id===catId);
  G={ cat, name:lastName||'Igralec', qs:shuffle(cat.questions).slice(0,CFG.rounds), round:0, total:0, state:'intro' };
  W.mode='game'; W.target=0; document.body.classList.add('ingame'); sfx.start(); updateHud();
  ui.innerHTML=`<div class="box"><div class="qp px"><span class="chip tagc">${esc(cat.ime)}</span><div class="qt">Pripravi se!</div><div class="hint" style="margin:0 0 6px">Izberi besedo s seznama: čim redkejša beseda, tem več točk!</div><div class="cd" id="cd">3</div></div></div>`;
  let n=CFG.introSec; sfx.tick();
  const t=setInterval(()=>{ n--; if(n<=0){ clearInterval(t); askQuestion(); } else { $('#cd')&&($('#cd').textContent=n); sfx.tick(); } },1000); timers.push(t);
}
function updateHud(){ $('#hr').textContent = highs.length ? 'Rekord ' + highs[0].total*10 + ' m' : ''; }
const steps=()=>`<div class="steps">${Array.from({length:CFG.rounds},(_,i)=>`<i class="${i<G.round?'d':i===G.round?'c':''}"></i>`).join('')}</div>`;

function askQuestion(){
  clearTimers();                                   // nobenih zaostalih časovnikov iz prejšnjega kroga
  G.state='question'; const q=G.qs[G.round]; let done=false, cur=null;
  ui.innerHTML=`<div class="box"><div class="qp px"><span class="chip tagc">${esc(G.cat.ime)} · ${G.round+1}/${CFG.rounds}</span>${steps()}
    <div class="qt">${esc(q.q)}</div><div class="seg" id="seg">${'<i class="on"></i>'.repeat(CFG.answerSec)}</div><div class="secs" id="secs">${CFG.answerSec} s</div>
    <input id="ans" class="ans-in" maxlength="40" placeholder="Vpiši odgovor in pritisni Enter" autocomplete="off" spellcheck="false">
    <div class="chk" id="chk">&nbsp;</div><button class="btn" id="sub" disabled>Oddaj ▶</button>
    <div class="hint">Veljajo samo besede s seznama – tipkarske napake se popravijo same.</div></div></div>`;
  const inp=$('#ans'), sub=$('#sub'), chk=$('#chk'); inp.focus();
  const check=()=>{ const v=inp.value, m=matchAnswer(q,v), t=v.trim();
    if(m.kind==='listed'){ cur=m; sub.disabled=false; chk.className='chk ok'; chk.textContent = norm(v)===norm(m.label) ? '✔ ' + m.label : '✔ ' + m.label + '  (popravljeno)'; }
    else { cur=null; sub.disabled=true; chk.className='chk' + (t.length>=3?' bad':''); chk.innerHTML = t.length>=3 ? '✖ Te besede ni na seznamu – poskusi drugo' : '&nbsp;'; } };
  const end=force=>{ if(done) return; if(!cur){ if(!force){ inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); if(!chk.classList.contains('bad')){ chk.className='chk bad'; chk.textContent='✖ Vpiši besedo s seznama'; } return; } }
    done=true; cancelAnimationFrame(tickRaf); sfx.submit(); reveal(q, cur?cur.label:'', force&&!cur); };
  sub.onclick=()=>end(false); inp.oninput=check; inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); end(false); } };
  const t0=performance.now(); let last=-1;
  const tick=()=>{ if(done) return; const left=Math.max(0,CFG.answerSec-(performance.now()-t0)/1000), s=Math.ceil(left); if(s!==last){ last=s; const seg=$('#seg'); if(!seg) return; [...seg.children].forEach((c,i)=>c.classList.toggle('on',i<s)); seg.classList.toggle('low',s<=5); $('#secs').textContent=s+' s'; if(s<=5&&s>0) sfx.tick(); }
    if(left<=0) end(true); else tickRaf=requestAnimationFrame(tick); };
  tick();
}

function reveal(q,text,timedOut){
  G.state='reveal';
  const r=matchAnswer(q,text); if(r.kind!=='listed') { r.pts=0; r.kind='empty'; } G.total+=r.pts; W.target=G.total*10; updateHud();
  const rarest=q.answers.slice().sort((a,b)=>b.pts-a.pts).slice(0,4);
  const pct=r.kind==='empty'?0:Math.min(100,r.pts);
  const tag=r.kind==='empty'?(timedOut?'Čas je potekel!':'Brez odgovora'):r.pts>=60?'Zelo redek odgovor!':r.pts>=35?'Redek odgovor!':r.pts>=13?'Dokaj običajen':'Preveč običajno…';
  const last=G.round===CFG.rounds-1;
  const cells=Array.from({length:20},(_,i)=>{ const k=i/19; const c=k<.33?'#4b6a8a':k<.66?'#38e1ff':k<.85?'#a78bfa':'#ffd86b'; return `<i style="background:${c}"></i>`; }).join('');
  ui.innerHTML=`<div class="box"><div class="qp px"><span class="chip tagc">Odgovor</span>${steps().replace('class="c"','class="d"')}
    <div class="hint" style="margin:0 0 4px">${esc(q.q)}</div><div class="ans">${esc(r.kind==='empty'?'—':r.kind==='listed'?r.label:text.trim())}</div>
    <div class="pts" id="pts">+0</div><div class="tg">${tag}</div>
    <div class="rbar">${cells}<div class="mk" id="mk"></div></div><div class="rl"><span>pogosto</span><span>redko</span><span>zelo redko</span></div>
    <div class="rare">Najredkejši: ${rarest.map(x=>`<b>${esc(x.label)}</b> (${x.pts})`).join(' · ')}</div>
    <button class="btn" id="next">${last?'Rezultat ▶':'Naprej ▶'}</button><div class="hint">Enter = naprej</div></div></div>`;
  sfx.reveal(r.pts); setTimeout(()=>{ const m=$('#mk'); if(m) m.style.left=pct+'%'; },80);
  countUp($('#pts'),r.pts,900,'+');
  const rc=$('.qp').getBoundingClientRect();
  if(r.pts>=35){ burst(rc.left+rc.width/2,rc.top+110,r.pts>=60?90:40); floatPts('+'+r.pts,rc.left+rc.width/2,rc.top+20); }
  let moved=false;
  const go=()=>{ if(moved||G.state!=='reveal') return; moved=true; clearTimers(); G.next=null; G.round++; if(G.round>=CFG.rounds) finish(); else askQuestion(); };
  $('#next').onclick=go; G.next=go; later(go,14000);
}

function finish(){
  G.state='result'; clearTimers(); updateHud();
  const entry={ name:G.name, total:G.total, cat:G.cat.ime, t:Date.now() };
  highs.push(entry); highs.sort((a,b)=>b.total-a.total||a.t-b.t); highs=highs.slice(0,10);
  const rank=highs.indexOf(entry)+1; saveHighs(); sfx.fanfare();
  const head=rank===1?'Nov rekord!':rank>0?rank+'. mesto!':'Potop končan!';
  ui.innerHTML=`<div class="box" style="width:min(880px,92vw)"><div class="qp px"><span class="chip tagc">${esc(head)}</span><div class="res"><div>
      <div class="hint" style="margin:0">${esc(G.name)} je zaplaval/a do</div><div class="big2" id="db">0 m</div>
      <div class="fact">${esc(G.cat.dejstvo)}</div><div class="cta">${esc(SOLA.poziv)}</div>
      <button class="btn" id="again">Nov potop ▶</button><div class="auto"><b id="ab"></b></div></div>
      <div class="lb2"><h3>Lestvica</h3><ol class="lb" style="all:unset;display:block;list-style:none;font-size:24px">${lbRows(rank,7)}</ol></div></div></div></div>`;
  countUp($('#db'),G.total*10,1500,'',' m');
  setTimeout(()=>{ if(rank>=1&&rank<=3||G.total>=150){ burst(innerWidth/2,innerHeight/2,150); burst(innerWidth*.3,innerHeight*.4,70); burst(innerWidth*.7,innerHeight*.4,70); } },500);
  $('#again').onclick=()=>{ lastName=''; selCat=null; showStart(); };
  const t0=performance.now(), tick=()=>{ const k=1-(performance.now()-t0)/(CFG.resultSec*1000), b=$('#ab'); if(!b) return; b.style.width=Math.max(0,k*100)+'%'; if(k<=0){ lastName=''; selCat=null; showStart(); } else tickRaf=requestAnimationFrame(tick); };
  tick();
}

/* ============ tipkovnica ============ */
addEventListener('keydown',e=>{
  const a=document.activeElement, typing=a&&a.tagName==='INPUT';
  if((e.key==='f'||e.key==='F')&&!typing) toggleFs();
  if(G&&G.state==='reveal'&&(e.key==='Enter'||e.key===' ')&&!e.repeat&&!(e.target&&e.target.id==='ans')){ e.preventDefault(); const n=G.next; G.next=null; n&&n(); return; }
  if(!G&&e.key==='Enter'&&selCat&&!typing){ startGame(selCat); return; }
  if(!G&&e.key==='Enter'&&selCat&&a&&a.id==='nm'){ startGame(selCat); return; }
  const inp=$('#ans')||$('#nm'); if(inp&&a!==inp&&e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey) inp.focus();
});
$('#clr').onclick=()=>{ if(confirm('Izbrišem celotno lestvico?')){ highs=[]; saveHighs(); if(!G) showStart(); } };
document.addEventListener('visibilitychange',()=>{ if(actx&&actx.state==='suspended') actx.resume(); });
(document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>{});
showStart();
</script>
