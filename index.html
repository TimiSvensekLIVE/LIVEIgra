    for(let i=0;i<5;i++){ const cx=((h1(i)*lw*1.4 + t*(2+i*.8)) % (lw*1.4+60)) - 30, cy=surf-80+Math.round(h1(i,4)*50)-i*3, w=26+Math.round(h1(i,2)*30);
      g.fillStyle='#fff'; g.fillRect(cx+4,cy,w-8,6); g.fillRect(cx,cy+4,w,6); g.fillRect(cx+8,cy-4,w*.4,6); g.fillStyle='#dcecf7'; g.fillRect(cx,cy+8,w,3); }
  }
  // voda po pasovih
  const top=Math.max(0,surf);
  for(let y=top;y<lh;y+=2){ g.fillStyle=rgb(waterRGB(dM(y))); g.fillRect(0,y,lw,2); }
  // valovanje
  if (surf>-4 && surf<lh) { const c0=waterRGB(0); for(let x=0;x<lw;x++){ const ty=surf+Math.round(Math.sin(x*.07+t*1.3)*1.5+Math.sin(x*.19-t*1.7)*.8); g.fillStyle=rgb(c0); g.fillRect(x,ty,1,3-(ty-surf)); g.fillStyle='rgba(215,245,255,.85)'; g.fillRect(x,ty,1,1); } }
  // svetlobni žarki
  const sh=Math.max(0,1-Math.max(0,W.depth)/350 - Math.max(0,(cam)/(lh*2)));
  if (sh>0 && surf<lh) { g.fillStyle=`rgba(255,255,255,${.06*sh})`; for(let k=0;k<6;k++){ const bx=((k*83+ t*3)%(lw+80))-40; g.beginPath(); g.moveTo(bx,Math.max(0,surf)); g.lineTo(bx+14,Math.max(0,surf)); g.lineTo(bx-40,lh); g.lineTo(bx-62,lh); g.fill(); } }

  // ladja
  if (surf>-30 && surf<lh+10) { const bx=Math.round(lw*(W.mode==='start'?.22:.1) + Math.sin(t*.5)*4); g.drawImage(SP.boat, bx, Math.round(surf-SP.boat.height+3+Math.sin(t*1.3)*1)); }

  // ribe in globinska bitja
  const B=34, b0=Math.floor((cam-30)/B), b1=Math.floor((cam+lh+30)/B);
  for(let b=b0;b<=b1;b++){ if(b*B<14) continue;
    for(let k=0;k<2;k++){ if(h1(b,k)>.6) continue;
      const wy=b*B+h1(b,k+9)*B, d=wy/PXM, dir=h1(b,k+5)>.5?1:-1, sp=4+h1(b,k+6)*10, span=lw+70;
      const x=((h1(b,k+3)*span + t*sp*dir)%span+span)%span-35, y=Math.round(wy-cam); let s;
      if (d>1100 && h1(b,k+7)>.5) { s=dir>0?SP.angler:SP.anglerf; glow(x+(dir>0?12:4),y,22,'rgba(255,229,138,A)',.35); }
      else if (d>550 && h1(b,k+7)>.35) { s=SP.jelly; y2: { const yy=y+Math.round(Math.sin(t*2+b)*3); glow(x+4,yy+3,18,'rgba(200,96,255,A)',.3); g.drawImage(s,Math.round(x),yy); } continue; }
      else if (d>220 && h1(b,k+7)>.5) s=SP.squid;
      else s = h1(b,k+8)>.45 ? (dir>0?SP.fishM:SP.fishMf) : (dir>0?SP.fishS:SP.fishSf);
      g.globalAlpha=Math.max(.35,.7-d/3000); g.drawImage(s,Math.round(x),y); g.globalAlpha=1;
    }
  }
  // morski sneg
  if (W.depth>15 || cam>-lh*.3) { g.fillStyle='rgba(200,230,255,.35)'; for(let i=0;i<50;i++){ const x=(h1(i)*lw+Math.sin(t+i)*3+lw)%lw, y=((h1(i,2)*lh*3 - cam*.5 + t*3)%lh+lh)%lh; if(y>surf+3) g.fillRect(Math.round(x),Math.round(y),1,1); } }

  // rekord (zlata črta)
  if (highs.length && W.mode!=='start') { const ry=Math.round(highs[0].total*10*PXM - cam + 20); if(ry>0&&ry<lh){ g.fillStyle='#ffd86b'; for(let x=0;x<lw;x+=6) g.fillRect(x,ry,3,1); g.fillRect(lw-14,ry-4,8,4); g.fillRect(lw-12,ry,4,2); } }
  // ravnilo
  if (W.mode!=='start') { for(let m=0;m<=6000;m+=50){ const y=Math.round(m*PXM-cam+20); if(y<-2||y>lh+2) continue; g.fillStyle=m%250===0?'rgba(255,255,255,.55)':'rgba(255,255,255,.25)'; g.fillRect(lw-(m%250===0?9:5),y,m%250===0?9:5,1); } g.fillStyle='rgba(255,255,255,.2)'; g.fillRect(lw-1,0,1,lh); }

  // kozica
  const kx=Math.round(lw*W.kx), ky=Math.round(kyW-cam+Math.sin(t*2)*1.5);
  if (!(W.mode==='start' && false)) {
    glow(kx+6,ky+3,20,'rgba(255,61,90,A)',.4);
    const kr = W.mode==='start' ? SP.krillf : SP.krill; g.drawImage(kr,kx,ky);
    if (Math.random()<.05) bubs.push({x:kx+(W.mode==='start'?8:2),y:kyW,life:1});
  }
  bubs=bubs.filter(b=>b.life>0); for(const b of bubs){ b.y-=.25; b.life-=.01; g.fillStyle=`rgba(220,245,255,${b.life*.6})`; g.fillRect(Math.round(b.x+Math.sin(b.y*.3)),Math.round(b.y-cam),1,1); }

  // delci
  parts=parts.filter(p=>p.life>0); for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=.06; p.life-=.015; g.globalAlpha=Math.max(0,p.life); g.fillStyle=p.c; g.fillRect(Math.round(p.x),Math.round(p.y),2,2); } g.globalAlpha=1;
  // tema ob robovih (vinjeta) – globlje bolj
  const vg=Math.min(.55, W.depth/6000); if (vg>.02) { const gr=g.createRadialGradient(lw/2,lh/2,lh*.35,lw/2,lh/2,lw*.7); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,`rgba(0,0,0,${vg})`); g.fillStyle=gr; g.fillRect(0,0,lw,lh); }

  // HUD
  $('#hd').textContent = Math.round(W.depth) + ' m';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function floatPts(text,x,y){ const e=document.createElement('div'); e.className='float'; e.textContent=text; e.style.left=(x-50)+'px'; e.style.top=y+'px'; document.body.appendChild(e); setTimeout(()=>e.remove(),1600); }
function countUp(el,to,ms,prefix='',suffix=''){ const t0=performance.now(); const step=t=>{ const k=Math.min(1,(t-t0)/ms); el.textContent=prefix+Math.round(to*(1-Math.pow(1-k,3)))+suffix; if(k<1) requestAnimationFrame(step); }; requestAnimationFrame(step); }

/* ============ igra ============ */
let G=null, timers=[], tickRaf=0, lastName='', selCat=null;
/* ---- zaloga nagrad (shranjena v brskalniku prenosnika) ---- */
const PRIZES=(SOLA.nagrade||[]).map(p=>typeof p==='string'?{ime:p,kolicina:9999,teza:1}:p);
let stock={}; try{ stock=JSON.parse(localStorage.getItem('kd_stock')||'{}'); }catch(e){}
const saveStock=()=>{ try{ localStorage.setItem('kd_stock',JSON.stringify(stock)); }catch(e){} };
const left=p=>stock[p.ime]===undefined?p.kolicina:stock[p.ime];
// razporeditev čez dogodek: začetek = prva igra po ponastavitvi zaloge; nagrada sme biti podeljena največ kolicina*delež+1-krat
let evStart=0; try{ evStart=Number(localStorage.getItem('kd_evstart')||0); }catch(e){}
const markStart=()=>{ if(!evStart){ evStart=Date.now(); try{ localStorage.setItem('kd_evstart',String(evStart)); }catch(e){} } };
const evHours=()=>SOLA.trajanjeUr||6;
const progress=()=>evStart?Math.min(1,(Date.now()-evStart)/(evHours()*3600e3)):0;
const allowedNow=p=>Math.floor(p.kolicina*progress())+1;
const availablePrizes=()=>{ const have=PRIZES.filter(p=>left(p)>0), ok=have.filter(p=>p.kolicina>100||(p.kolicina-left(p))<allowedNow(p)); return ok.length?ok:have; };   // razporeditev velja za redke nagrade (do 100 kosov)   // če nič ne ustreza, ne zavrnemo nagrade
const takePrize=p=>{ stock[p.ime]=left(p)-1; saveStock(); };
let hintsOn=true; try{ hintsOn=localStorage.getItem('kd_hints')!=='0'; }catch(e){}   // igralec izbere, ali želi namige
const clearTimers=()=>{ timers.forEach(t=>{clearTimeout(t);clearInterval(t);}); timers=[]; cancelAnimationFrame(tickRaf); };
const later=(fn,ms)=>{ const t=setTimeout(fn,ms); timers.push(t); return t; };
/* ---- lestvica: podij (1.–3. mesto) + vrstice (4.–10.) ---- */
const rowsHTML=(from,to,rank=0)=>highs.slice(from,to).map((h,k)=>{ const i=from+k; return `<li class="${rank===i+1?'me':''}"><span class="rk">${i+1}.</span><span class="n">${esc(h.name)}</span><span class="d">${h.total*10} m</span></li>`; }).join('');
const podiumHTML=(rank=0)=>`<div class="podium">${[1,0,2].map(i=>{ const h=highs[i]; return `<div class="pod p${i+1} ${rank===i+1?'me':''}"><div class="pcr">${i===0&&h?'👑':'&nbsp;'}</div><div class="pn">${h?esc(h.name):'—'}</div><div class="pd">${h?h.total*10+' m':'&nbsp;'}</div><div class="blk">${i+1}</div></div>`; }).join('')}</div>`;
const boardHTML=(rank=0)=>highs.length ? podiumHTML(rank)+(highs.length>3?'<ol>'+rowsHTML(3,10,rank)+'</ol>':'') : '<div class="empty">Lestvica je še prazna.<br>Bodi prvi!</div>';

function startGame(catId){
  markStart();
  if(actx&&actx.state==='suspended') actx.resume();
  lastName=($('#nm').value||'').trim().slice(0,14);
  const cat=CATEGORIES.find(c=>c.id===catId);
  G={ cat, name:lastName||'Igralec', qs:(()=>{ const easy=shuffle(cat.questions.filter(q=>!q.hard)), hard=shuffle(cat.questions.filter(q=>q.hard)); return easy.concat(hard).slice(0,CFG.rounds); })(), round:0, total:0, state:'intro' };
  W.mode='game'; W.target=0; document.body.classList.add('ingame'); sfx.start(); updateHud();
  ui.innerHTML=`<div class="box"><div class="qp px"><span class="chip tagc">${esc(cat.ime)}</span><div class="qt">Pripravi se!</div><div class="hint" style="margin:0 0 6px">Napiši besedo. Čim bolj posebna beseda, tem več točk!</div><div class="cd" id="cd">3</div></div></div>`;
  let n=CFG.introSec; sfx.tick();
  const t=setInterval(()=>{ n--; if(n<=0){ clearInterval(t); askQuestion(); } else { $('#cd')&&($('#cd').textContent=n); sfx.tick(); } },1000); timers.push(t);
}
function updateHud(){ $('#hr').textContent = highs.length ? 'Rekord ' + highs[0].total*10 + ' m' : ''; }
const steps=()=>`<div class="steps">${Array.from({length:CFG.rounds},(_,i)=>`<i class="${i<G.round?'d':i===G.round?'c':''}"></i>`).join('')}</div>`;

function askQuestion(){
  clearTimers();                                   // nobenih zaostalih časovnikov iz prejšnjega kroga
  G.state='question'; const q=G.qs[G.round]; let done=false, cur=null;
  ui.innerHTML=`<div class="box"><div class="qp px"><span class="chip tagc">${esc(G.cat.ime)} · ${G.round+1}/${CFG.rounds}</span>${steps()}
    <div class="qt">${esc(q.q)}</div><div class="seg" id="seg">${'<i class="on"></i>'.repeat(CFG.answerSec)}</div><div class="secs" id="secs">${CFG.answerSec} s</div>
    <input id="ans" class="ans-in" maxlength="40" placeholder="Vpiši odgovor in pritisni Enter" autocomplete="off" spellcheck="false">
    <div class="chk" id="chk">&nbsp;</div><button class="btn" id="sub" disabled>Oddaj ▶</button>
    <div class="hint" id="hint">Piši preproste besede. Če se zmotiš pri črki, igra popravi sama.</div></div></div>`;
  let hinted=false;
  const inp=$('#ans'), sub=$('#sub'), chk=$('#chk'); inp.focus();
  const check=()=>{ const v=inp.value, m=matchAnswer(q,v), t=v.trim();
    if(m.kind==='listed'){ cur=m; sub.disabled=false; chk.className='chk ok'; chk.textContent = norm(v)===norm(m.label) ? '✔ ' + m.label : '✔ ' + m.label + '  (popravljeno)'; }
    else { cur=null; sub.disabled=true; chk.className='chk' + (t.length>=3?' bad':''); chk.innerHTML = t.length>=3 ? '✖ Te besede ni na seznamu – poskusi drugo' : '&nbsp;'; } };
  const end=force=>{ if(done) return; if(!cur){ if(!force){ inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); if(!chk.classList.contains('bad')){ chk.className='chk bad'; chk.textContent='✖ Vpiši besedo s seznama'; } return; } }
    done=true; cancelAnimationFrame(tickRaf); sfx.submit(); reveal(q, cur?cur.label:'', force&&!cur); };
  sub.onclick=()=>end(false); inp.oninput=check; inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); end(false); } };
  const t0=performance.now(); let last=-1;
  const tick=()=>{ if(done) return; const left=Math.max(0,CFG.answerSec-(performance.now()-t0)/1000), s=Math.ceil(left);
    if(hintsOn && !hinted && CFG.answerSec-left>=CFG.hintAfterSec){ hinted=true; const easyA=q.answers.filter(a=>(a.raw||a.pts)<=25&&a.label.length>=4); const pick=easyA[Math.floor(Math.random()*easyA.length)]; const h=$('#hint'); if(pick&&h){ h.style.cssText='color:#ffd86b;font-size:30px;line-height:1.2;margin-top:16px;padding:10px 14px;background:#0f2147;border-left:5px solid #ffd86b'; h.textContent='Namig: ena od besed se začne z »'+pick.label.slice(0,3)+'…«'; } } if(s!==last){ last=s; const seg=$('#seg'); if(!seg) return; [...seg.children].forEach((c,i)=>c.classList.toggle('on',i<s)); seg.classList.toggle('low',s<=5); $('#secs').textContent=s+' s'; if(s<=5&&s>0) sfx.tick(); }
    if(left<=0) end(true); else tickRaf=requestAnimationFrame(tick); };
  tick();
}

function reveal(q,text,timedOut){
  G.state='reveal';
  const r=matchAnswer(q,text); if(r.kind!=='listed') { r.pts=0; r.kind='empty'; } G.total+=r.pts; W.target=G.total*10; updateHud();
  const rarest=q.answers.filter(a=>(a.raw||a.pts)<=50).sort((a,b)=>(b.raw||b.pts)-(a.raw||a.pts)).slice(0,4);
  const pct=r.kind==='empty'?0:Math.min(100,r.pts);
  const tag=r.kind==='empty'?(timedOut?'Čas je potekel!':'Brez odgovora'):r.pts>=75?'Zelo redek odgovor!':r.pts>=45?'Redek odgovor!':r.pts>=18?'Dokaj običajen':'Preveč običajno…';
  const last=G.round===CFG.rounds-1;
  const cells=Array.from({length:20},(_,i)=>{ const k=i/19; const c=k<.33?'#4b6a8a':k<.66?'#38e1ff':k<.85?'#a78bfa':'#ffd86b'; return `<i style="background:${c}"></i>`; }).join('');
  ui.innerHTML=`<div class="box"><div class="qp px"><span class="chip tagc">Odgovor</span>${steps().replace('class="c"','class="d"')}
    <div class="hint" style="margin:0 0 4px">${esc(q.q)}</div><div class="ans">${esc(r.kind==='empty'?'—':r.kind==='listed'?r.label:text.trim())}</div>
    <div class="pts" id="pts">+0</div><div class="tg">${tag}</div>
    <div class="rbar">${cells}<div class="mk" id="mk"></div></div><div class="rl"><span>pogosto</span><span>redko</span><span>zelo redko</span></div>
    <div class="rare">Najredkejši: ${rarest.map(x=>`<b>${esc(x.label)}</b> (${x.pts})`).join(' · ')}</div>
    <button class="btn" id="next">${last?'Rezultat ▶':'Naprej ▶'}</button><div class="hint">Enter = naprej</div></div></div>`;
  sfx.reveal(r.pts); setTimeout(()=>{ const m=$('#mk'); if(m) m.style.left=pct+'%'; },80);
  countUp($('#pts'),r.pts,900,'+');
  const rc=$('.qp').getBoundingClientRect();
  if(r.pts>=45){ burst(rc.left+rc.width/2,rc.top+110,r.pts>=75?90:40); floatPts('+'+r.pts,rc.left+rc.width/2,rc.top+20); }
  let moved=false;
  const go=()=>{ if(moved||G.state!=='reveal') return; moved=true; clearTimers(); G.next=null; G.round++; if(G.round>=CFG.rounds) finish(); else askQuestion(); };
  $('#next').onclick=go; G.next=go; later(go,14000);
}

function finish(){
  G.state='result'; clearTimers(); updateHud();
  const entry={ name:G.name, total:G.total, cat:G.cat.ime, t:Date.now() };
  highs.push(entry); highs.sort((a,b)=>b.total-a.total||a.t-b.t); highs=highs.slice(0,10);
  const rank=highs.indexOf(entry)+1; saveHighs(); sfx.fanfare();
  const head=rank===1?'Nov rekord!':rank>0?rank+'. mesto!':'Potop končan!';
  const win=rank>=1&&availablePrizes().length>0, soldOut=rank>=1&&!win;     // top 10 = nagrada (če je še kaj na zalogi)
  G.hold=false; G.prize=null;
  ui.innerHTML=`<div class="box" style="width:min(1000px,95vw)"><div class="qp px"><span class="chip tagc">${esc(head)}</span><div class="res"><div>
      <div class="hint" style="margin:0">${esc(G.name)} je zaplaval/a do</div><div class="big2" id="db">0 m</div>
      ${win?`<div class="prize" id="prizeBanner">🏆 Zmagal/a si nagrado!</div>`:soldOut?`<div class="prize" style="animation:none">🏆 Odličen rezultat! Nagrade so žal pošle.</div>`:`<div class="fact">${esc(G.cat.dejstvo)}</div>`}
      <div class="cta">${esc(SOLA.poziv)}</div>
      ${win?'<button class="btn gold" id="spinOpen">🎡 Kolo sreče</button>':''}<button class="btn" id="again">Nov potop ▶</button><div class="auto"><b id="ab"></b></div></div>
      <div class="lb2 bd"><h3>Lestvica – top 10</h3>${boardHTML(rank)}</div></div></div></div>`;
  countUp($('#db'),G.total*10,1500,'',' m');
  setTimeout(()=>{ if(rank>=1&&rank<=3||G.total>=220){ burst(innerWidth/2,innerHeight/2,150); burst(innerWidth*.3,innerHeight*.4,70); burst(innerWidth*.7,innerHeight*.4,70); } },500);
  $('#again').onclick=()=>{ lastName=''; selCat=null; showStart(); };
  const afterWheel=()=>{ if(SOLA.obrazec) later(()=>{ if(G&&G.state==='result') showFormPrompt(); },400); };
  if(win){
    $('#spinOpen').onclick=()=>showWheel(entry,afterWheel);
    later(()=>{ if(G&&G.state==='result') showWheel(entry,afterWheel); },1800);       // kolo se odpre samo
  } else if(SOLA.obrazec) later(()=>{ if(G&&G.state==='result') showFormPrompt(); },1100);   // vprašanje o obrazcu po koncu igre
  const total=(win?CFG.resultSec*2:CFG.resultSec)*1000; let end=performance.now()+total, last=performance.now();
  const tick=()=>{ const now=performance.now(); if(G&&G.hold) end+=now-last; last=now; const k=(end-now)/total, b=$('#ab'); if(!b) return; b.style.width=Math.max(0,k*100)+'%'; if(k<=0){ lastName=''; selCat=null; showStart(); } else tickRaf=requestAnimationFrame(tick); };
  tick();
}

/* ---- kolo sreče (nagrade so v questions.js -> SOLA.nagrade) ---- */
function showWheel(entry,done){
  if($('#wheelModal')) return;
  const avail=availablePrizes(), prizes=avail.map(p=>p.ime), N=prizes.length; if(!N){ done&&done(); return; }
  if(G) G.hold=true;
  const S=Math.round(Math.max(280,Math.min(innerHeight*.54,innerWidth*.86,520))), dpr=Math.min(2,window.devicePixelRatio||1);
  const m=document.createElement('div'); m.id='wheelModal';
  m.style.cssText='position:fixed;inset:0;z-index:45;background:rgba(2,6,15,.82);display:flex;align-items:center;justify-content:center';
  m.innerHTML=`<div class="px" style="position:relative;padding:30px 30px 22px;text-align:center;max-width:96vw"><span class="chip tagc">Kolo sreče</span>
    <div id="wtitle" style="font-size:30px;margin:2px 0 14px">Čestitamo! Zavrti kolo za nagrado.</div>
    <div class="wheelwrap" style="width:${S}px;height:${S}px"><div class="ptr"></div><canvas id="wheel" width="${Math.round(S*dpr)}" height="${Math.round(S*dpr)}" style="width:${S}px;height:${S}px"></canvas></div>
    <div id="wres" class="wres">&nbsp;</div>
    <button class="btn gold" id="wSpin" style="margin-right:0">Zavrti!</button><button class="btn" id="wClose" style="display:none">Naprej ▶</button></div>`;
  document.body.appendChild(m);
  const cvs=$('#wheel'), c=cvs.getContext('2d'); c.scale(dpr,dpr);
  const COLS=['#38e1ff','#ffd86b','#ff4f8b','#34d399','#a78bfa','#fb923c'], TAU=Math.PI*2, R=S/2-14;
  const slots=[]; while(slots.length<8){ for(let i=0;i<N;i++) slots.push(i); }      // kolo ima vedno vsaj 8 polj (nagrade se po potrebi ponovijo)
  const SN=slots.length, seg=TAU/SN;
  let theta=Math.random()*TAU, winIdx=-1, shown=-1, anim=null, lastIdx=-1, raf=0, spun=false;
  const draw=now=>{
    c.clearRect(0,0,S,S); c.save(); c.translate(S/2,S/2);
    c.beginPath(); c.arc(0,0,R+12,0,TAU); c.fillStyle='#fff'; c.fill();
    c.beginPath(); c.arc(0,0,R+7,0,TAU); c.fillStyle='#0b1530'; c.fill();
    c.save(); c.rotate(theta);
    for(let i=0;i<SN;i++){
      const a0=i*seg-Math.PI/2, a1=a0+seg, label=prizes[slots[i]];
      c.beginPath(); c.moveTo(0,0); c.arc(0,0,R,a0,a1); c.closePath(); c.fillStyle=COLS[i%COLS.length]; c.fill(); c.lineWidth=3; c.strokeStyle='#0b1530'; c.stroke();
      if(i===shown){ c.save(); c.globalAlpha=.25+.35*(Math.sin(now/110)*.5+.5); c.fillStyle='#fff'; c.beginPath(); c.moveTo(0,0); c.arc(0,0,R,a0,a1); c.closePath(); c.fill(); c.restore(); }
      c.save(); c.rotate(a0+seg/2); c.textAlign='right'; c.textBaseline='middle'; c.fillStyle='#04121f';
      let fs=Math.round(S*.075); c.font=fs+'px VT323, monospace'; while(c.measureText(label).width>R*.6&&fs>12){ fs--; c.font=fs+'px VT323, monospace'; }
      c.fillText(label,R-16,0); c.restore();
    }
    c.restore();
    for(let k=0;k<SN*2;k++){ const a=k*Math.PI/SN, on=((k+Math.floor(now/260))%2===0); c.beginPath(); c.arc(Math.cos(a)*(R+9.5),Math.sin(a)*(R+9.5),3.2,0,TAU); c.fillStyle=on?'#ffd86b':'#33466b'; c.fill(); }
    c.beginPath(); c.arc(0,0,S*.075,0,TAU); c.fillStyle='#0b1530'; c.fill(); c.lineWidth=4; c.strokeStyle='#fff'; c.stroke();
    c.fillStyle='#ffd86b'; c.font=Math.round(S*.05)+'px Silkscreen, monospace'; c.textAlign='center'; c.textBaseline='middle'; c.fillText('LIVE',0,1);
    c.restore();
  };
  const loop=now=>{
    if(!document.body.contains(m)) return;
    if(anim){
      const k=Math.min(1,(now-anim.t0)/anim.dur), e=1-Math.pow(1-k,4);        // gladko pojemanje (easeOutQuart)
      theta=anim.from+(anim.to-anim.from)*e;
      const idx=Math.floor((((-theta)%TAU)+TAU)%TAU/seg); if(idx!==lastIdx){ lastIdx=idx; sfx.tick(); }
      if(k>=1){ anim=null; stopped(); }
    }
    draw(now); raf=requestAnimationFrame(loop);
  };
  const spin=()=>{
    if(anim||spun) return;
    $('#wSpin').disabled=true; $('#wtitle').textContent='Vrtimo …'; sfx.start();
    const wts=avail.map(p=>p.teza||1); let r=Math.random()*wts.reduce((a,b)=>a+b,0), k=0; while(k<N-1&&r>=wts[k]){ r-=wts[k]; k++; }   // izžreba se glede na težo (redke nagrade redkeje)
    const j=Math.random()*.7-.35;                                               // nagrada je izžrebana vnaprej, kolo se ustavi nanjo
    const opts=[]; slots.forEach((p,i)=>{ if(p===k) opts.push(i); }); const s=opts[Math.floor(Math.random()*opts.length)];   // eno izmed polj te nagrade
    const target=(((-(s+.5+j)*seg)%TAU)+TAU)%TAU, cur=((theta%TAU)+TAU)%TAU, delta=(target-cur+TAU)%TAU;
    winIdx=s; lastIdx=-1; anim={ from:theta, to:theta+(6+Math.floor(Math.random()*3))*TAU+delta, t0:performance.now(), dur:5800 };
  };
  const close=()=>{ cancelAnimationFrame(raf); m.remove(); if(G) G.hold=false; if(spun&&done) done(); };
  const stopped=()=>{
    spun=true; shown=winIdx; const prize=prizes[slots[winIdx]]; takePrize(avail[slots[winIdx]]); entry.prize=prize; saveHighs(); if(G) G.prize=prize;
    $('#wtitle').textContent='Čestitamo!'; $('#wres').innerHTML='Osvojil/a si: <b>'+esc(prize)+'</b>';
    $('#wSpin').style.display='none'; $('#wClose').style.display=''; $('#wClose').focus();
    sfx.fanfare(); const r=cvs.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,140); burst(r.left+r.width*.2,r.top+r.height*.3,60); burst(r.left+r.width*.8,r.top+r.height*.3,60);
    const pb=$('#prizeBanner'); if(pb) pb.textContent='🎁 Nagrada: '+prize; const so=$('#spinOpen'); if(so) so.remove();
    later(()=>{ if(document.body.contains(m)) close(); },25000);
  };
  $('#wSpin').onclick=spin; $('#wClose').onclick=close; $('#wSpin').focus();
  m.addEventListener('keydown',e=>{ e.stopPropagation(); });
  later(()=>{ if(!spun&&document.body.contains(m)){ cancelAnimationFrame(raf); m.remove(); lastName=''; selCat=null; showStart(); } },60000);   // nihče ne vrti -> nazaj na začetek
  raf=requestAnimationFrame(loop);
}

/* ============ tipkovnica ============ */
addEventListener('keydown',e=>{
  const a=document.activeElement, typing=a&&a.tagName==='INPUT';
  if((e.key==='f'||e.key==='F')&&!typing) toggleFs();
  if(G&&G.state==='reveal'&&(e.key==='Enter'||e.key===' ')&&!e.repeat&&!(e.target&&e.target.id==='ans')){ e.preventDefault(); const n=G.next; G.next=null; n&&n(); return; }
  if(!G&&e.key==='Enter'&&selCat&&!typing){ startGame(selCat); return; }
  if(!G&&e.key==='Enter'&&selCat&&a&&a.id==='nm'){ startGame(selCat); return; }
  const inp=$('#ans')||$('#nm'); if(inp&&a!==inp&&e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey) inp.focus();
});
/* ---- po koncu igre: povabilo k obrazcu (Da / Ne) ---- */
function showFormPrompt(){
  if($('#formModal')) return;
  const m=document.createElement('div'); m.id='formModal';
  m.style.cssText='position:fixed;inset:0;z-index:60;background:rgba(2,6,15,.88);display:flex;align-items:center;justify-content:center;padding:12px';
  m.innerHTML=`<div class="px fpanel" style="position:relative;padding:40px 36px 30px;width:min(840px,96vw);text-align:center;animation:pop .25s steps(4);box-shadow:0 0 0 3px var(--navy),0 0 70px rgba(56,225,255,.95)"><span class="chip tagc" style="font-size:20px">Obrazec za dijake</span>
    <div style="font-size:clamp(34px,5vw,56px);line-height:1.08;margin:4px 0 12px;color:#fff">Želiš izpolniti kratek obrazec?</div>
    <div style="font-size:clamp(22px,2.6vw,30px);color:var(--gold);margin-bottom:4px">Prejmi informacije o študiju na L.I.V.E. Vzame le minuto.</div>
    <div style="font-size:21px;color:var(--dim);margin-bottom:18px">Obrazec je namenjen dijakom.</div>
    <label class="consent" id="consentBox"><input type="checkbox" id="formOk"><span>Strinjam se, da Višja strokovna šola L.I.V.E. obdeluje moje osebne podatke (ime, e-pošto in druge podatke, ki jih vpišem v obrazec) samo za namen obveščanja o vpisu in študiju. Soglasje lahko kadar koli prekličem.</span></label>
    <div id="formHint" style="min-height:30px;font-size:22px;color:#ff7a9c;margin:8px 0 4px"></div>
    <button class="btn off" id="formYes" style="font-size:clamp(28px,3.4vw,38px);padding:16px 40px;margin-right:14px">Da, odpri obrazec</button><button class="btn" id="formNo" style="font-size:clamp(24px,2.8vw,30px);padding:16px 30px;background:#2b4560;color:#e6f6ff;box-shadow:0 5px 0 #14263a">Ne, hvala</button></div>`;
  document.body.appendChild(m);
  const ok=$('#formOk');
  ok.onchange=()=>{ $('#formYes').classList.toggle('off',!ok.checked); $('#formHint').textContent=''; };
  $('#formYes').onclick=()=>{
    if(!ok.checked){ $('#formHint').textContent='Za nadaljevanje potrdi soglasje.'; const b=$('#consentBox'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); return; }
    window.open(SOLA.obrazec,'_blank','noopener'); m.remove();                 // obrazec se odpre šele po soglasju
  };
  $('#formNo').onclick=()=>m.remove();
  m.addEventListener('keydown',e=>e.stopPropagation());
  $('#formOk').focus();
}
const RESET_CODE='L.I.V.E';   // koda za ponastavitev lestvice
function askCode(title,msg,onOk){   // okvir, kamor vtipkaš kodo (L.I.V.E)
  if($('#codeModal')) return;
  const m=document.createElement('div'); m.id='codeModal';
  m.style.cssText='position:fixed;inset:0;z-index:50;background:rgba(2,6,15,.7);display:flex;align-items:center;justify-content:center';
  m.innerHTML=`<div class="px" style="padding:28px 30px;width:min(440px,92vw);text-align:center"><span class="chip tagc">${esc(title)}</span>
    <div style="font-size:26px;margin:6px 0 14px">${esc(msg)}</div>
    <input id="codeIn" class="ans-in" style="font-size:30px" maxlength="20" autocomplete="off" spellcheck="false" placeholder="Koda">
    <div id="codeMsg" style="min-height:28px;margin-top:10px;font-size:22px;color:#ff7a9c"></div>
    <button class="btn" id="codeOk" style="margin-right:10px">Potrdi</button><button class="btn" id="codeNo" style="background:#2b4560;color:#e6f6ff;box-shadow:0 5px 0 #14263a">Prekliči</button></div>`;
  document.body.appendChild(m);
  const inp=$('#codeIn'); inp.focus();
  const close=()=>m.remove();
  const ok=()=>{ if(inp.value.trim().toLowerCase()===RESET_CODE.toLowerCase()){ close(); onOk(); }
    else { $('#codeMsg').textContent='Napačna koda'; inp.value=''; inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.focus(); } };
  $('#codeOk').onclick=ok; $('#codeNo').onclick=close;
  inp.onkeydown=e=>{ e.stopPropagation(); if(e.key==='Enter') ok(); if(e.key==='Escape') close(); };
  m.addEventListener('keydown',e=>e.stopPropagation());
  m.onclick=e=>{ if(e.target===m) close(); };
}
$('#clr').onclick=()=>askCode('Ponastavitev lestvice','Vpiši kodo za izbris lestvice',()=>{ highs=[]; saveHighs(); if(!G) showStart(); });

/* ---- zaloga nagrad (za osebje) ---- */
function showStock(){
  if($('#stockModal')) return;
  const m=document.createElement('div'); m.id='stockModal';
  m.style.cssText='position:fixed;inset:0;z-index:48;background:rgba(2,6,15,.75);display:flex;align-items:center;justify-content:center';
  const rows=PRIZES.map(p=>{ const l=left(p); return `<li style="${l<=0?'opacity:.45':''}"><span class="n">${esc(p.ime)}</span><span class="d">${l} / ${p.kolicina}</span></li>`; }).join('');
  m.innerHTML=`<div class="px bd" style="position:relative;padding:30px 26px 20px;width:min(460px,94vw);text-align:center"><span class="chip tagc">Zaloga nagrad</span>
    <ol style="margin:6px 0 10px">${rows}</ol>
    <div style="font-size:17px;color:var(--dim);margin-bottom:6px">Ostane / skupaj. Čas dogodka: ${evStart?(progress()*evHours()).toFixed(1)+' h od '+evHours()+' h':'se še ni začel'}. Redke nagrade se razporedijo čez cel dogodek.</div>
    <button class="btn" id="stReset" style="margin-right:10px;background:#ff4f8b;color:#fff;box-shadow:0 5px 0 #8a2447">Ponastavi zalogo</button><button class="btn" id="stClose">Zapri</button></div>`;
  document.body.appendChild(m);
  const close=()=>m.remove(); $('#stClose').onclick=close; m.onclick=e=>{ if(e.target===m) close(); }; m.addEventListener('keydown',e=>{ e.stopPropagation(); if(e.key==='Escape') close(); });
  $('#stReset').onclick=()=>{ close(); askCode('Ponastavitev zaloge','Vpiši kodo za ponastavitev zaloge nagrad',()=>{ stock={}; saveStock(); evStart=0; try{ localStorage.removeItem('kd_evstart'); }catch(e){} }); };
  $('#stClose').focus();
}
$('#stockBtn').onclick=showStock;
document.addEventListener('visibilitychange',()=>{ if(!actx) return; if(document.hidden) actx.suspend(); else actx.resume(); });
(document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>{});
showStart();
</script>
