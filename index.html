const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ui = $('#ui');
$('#logo').src = SOLA.logo;

/* ============ ujemanje odgovorov ============ */
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9+#/ ]/g,' ').replace(/\s+/g,' ').trim();
// Levenshtein z zamenjavo sosednjih črk (pyhton -> python šteje kot 1 napaka)
function lev(a,b){ const d=[]; for(let i=0;i<=a.length;i++){ d[i]=[i]; } for(let j=0;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++){ const c=a[i-1]===b[j-1]?0:1; d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c); if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1); }
  return d[a.length][b.length]; }
for (const c of CATEGORIES) for (const q of c.questions) for (const a of q.answers) { a.n=a.names.map(norm); a.label=a.names[0]; }
const STOP=new Set(['ali','pri','kot','vse','sam','sem','brez','med','pod','nad','ter','tudi','ima','kaj','kdo']);
const listed=(q,i,exact)=>({kind:'listed',pts:q.answers[i].pts,label:q.answers[i].label,exact});
// Sprejme samo odgovore s seznama (ali dovolj podobne – tipkarske napake). Sicer vrne kind:'none'.
function matchCore(q,raw,noContain){
  const t=norm(raw||''); if(!t.replace(/[^a-z0-9]/g,'')) return {kind:'empty',pts:0,label:'—'};
  for(let i=0;i<q.answers.length;i++) if(q.answers[i].n.includes(t)) return listed(q,i,true);
  if(t.length>=3){ let best=null; q.answers.forEach((a,i)=>a.n.forEach(nm=>{ if(nm.length<4) return; const lim=nm.length>=8?2:1; if(Math.abs(nm.length-t.length)>lim) return; const d=lev(t,nm); if(d<=lim&&(!best||d<best.d)) best={i,d}; })); if(best) return listed(q,best.i,false); }
  // skrajšana oblika: ena beseda je prva ali zadnja beseda daljšega odgovora (npr. "usb" -> "usb ključek")
  if(t.length>=3&&!t.includes(' ')&&!STOP.has(t)){ let w=null; q.answers.forEach((a,i)=>a.n.forEach(nm=>{ if(!nm.includes(' ')) return; const p=nm.split(' '); if((p[0]===t||p[p.length-1]===t)&&(!w||a.pts<q.answers[w].pts)) w=i; })); if(w!==null) return listed(q,w,false); }
  if(!noContain){ let f=null; q.answers.forEach((a,i)=>a.n.forEach(nm=>{ if(nm.length>=4&&(' '+t+' ').includes(' '+nm+' ')&&(!f||nm.length>f.len)) f={i,len:nm.length}; })); if(f) return listed(q,f.i,false); }
  return {kind:'none',pts:0,label:''};
}

  const k=keywordMatch(q,t); if(k){ k.exact=false; return k; }

function frame(ms){

function askQuestion(){

    else { cur=null; sub.disabled=true; chk.className='chk' + (t.length>=3?' bad':''); chk.innerHTML = t.length>=3 ? '✖ Te besede ni na seznamu – poskusi drugo' : '&nbsp;'; } };
  const end=force=>{ if(done) return; if(!cur){ if(!force){ inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); if(!chk.classList.contains('bad')){ chk.className='chk bad'; chk.textContent='✖ Vpiši besedo s seznama'; } return; } }
    done=true; cancelAnimationFrame(tickRaf); sfx.submit(); reveal(q, cur?cur.label:'', force&&!cur); };
  sub.onclick=()=>end(false); inp.oninput=check; inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); end(false); } };

    if(hintsOn && !hinted && CFG.answerSec-left>=CFG.hintAfterSec){ hinted=true; const easyA=q.answers.filter(a=>(a.raw||a.pts)<=25&&a.label.length>=4); const pick=easyA[Math.floor(Math.random()*easyA.length)]; const h=$('#hint'); if(pick&&h){ h.style.cssText='color:#ffd86b;font-size:30px;line-height:1.2;margin-top:16px;padding:10px 14px;background:#0f2147;border-left:5px solid #ffd86b'; h.textContent='Namig: ena od besed se začne z »'+pick.label.slice(0,3)+'…«'; } } if(s!==last){ last=s; const seg=$('#seg'); if(!seg) return; [...seg.children].forEach((c,i)=>c.classList.toggle('on',i<s)); seg.classList.toggle('low',s<=5); $('#secs').textContent=s+' s'; if(s<=5&&s>0) sfx.tick(); }
    if(left<=0) end(true); else tickRaf=requestAnimationFrame(tick); };

function reveal(q,text,timedOut){
  G.state='reveal';
  const r=matchAnswer(q,text); if(r.kind!=='listed') { r.pts=0; r.kind='empty'; } G.total+=r.pts; W.target=G.total*10; updateHud();

  const pct=r.kind==='empty'?0:Math.min(100,r.pts);
  const tag=r.kind==='empty'?(timedOut?'Čas je potekel!':'Brez odgovora'):r.pts>=75?'Zelo redek odgovor!':r.pts>=45?'Redek odgovor!':r.pts>=18?'Dokaj običajen':'Preveč običajno…';
  const last=G.round===CFG.rounds-1;
  const cells=Array.from({length:20},(_,i)=>{ const k=i/19; const c=k<.33?'#4b6a8a':k<.66?'#38e1ff':k<.85?'#a78bfa':'#ffd86b'; return `<i style="background:${c}"></i>`; }).join('');
  ui.innerHTML=`<div class="box"><div class="qp px"><span class="chip tagc">Odgovor</span>${steps().replace('class="c"','class="d"')}
    <div class="hint" style="margin:0 0 4px">${esc(q.q)}</div><div class="ans">${esc(r.kind==='empty'?'—':r.kind==='listed'?r.label:text.trim())}</div>

    <div class="rbar">${cells}<div class="mk" id="mk"></div></div><div class="rl"><span>pogosto</span><span>redko</span><span>zelo redko</span></div>
    <div class="rare">Najredkejši: ${rarest.map(x=>`<b>${esc(x.label)}</b> (${x.pts})`).join(' · ')}</div>
    <button class="btn" id="next">${last?'Rezultat ▶':'Naprej ▶'}</button><div class="hint">Enter = naprej</div></div></div>`;
  sfx.reveal(r.pts); setTimeout(()=>{ const m=$('#mk'); if(m) m.style.left=pct+'%'; },80);
  countUp($('#pts'),r.pts,900,'+');
  const rc=$('.qp').getBoundingClientRect();
  if(r.pts>=45){ burst(rc.left+rc.width/2,rc.top+110,r.pts>=75?90:40); floatPts('+'+r.pts,rc.left+rc.width/2,rc.top+20); }
  let moved=false;
  const go=()=>{ if(moved||G.state!=='reveal') return; moved=true; clearTimers(); G.next=null; G.round++; if(G.round>=CFG.rounds) finish(); else askQuestion(); };
  $('#next').onclick=go; G.next=go; later(go,14000);

function finish(){

      <div class="lb2 bd"><h3>Lestvica – top 10</h3>${boardHTML(rank)}</div></div></div></div>`;

  setTimeout(()=>{ if(rank>=1&&rank<=3||G.total>=220){ burst(innerWidth/2,innerHeight/2,150); burst(innerWidth*.3,innerHeight*.4,70); burst(innerWidth*.7,innerHeight*.4,70); } },500);
  $('#again').onclick=()=>{ lastName=''; selCat=null; showStart(); };

  } else if(SOLA.obrazec) later(()=>{ if(G&&G.state==='result') showFormPrompt(); },1100);   // vprašanje o obrazcu po koncu igre
  const total=(win?CFG.resultSec*2:CFG.resultSec)*1000; let end=performance.now()+total, last=performance.now();
  const tick=()=>{ const now=performance.now(); if(G&&G.hold) end+=now-last; last=now; const k=(end-now)/total, b=$('#ab'); if(!b) return; b.style.width=Math.max(0,k*100)+'%'; if(k<=0){ lastName=''; selCat=null; showStart(); } else tickRaf=requestAnimationFrame(tick); };

/* ---- kolo sreče (nagrade so v questions.js -> SOLA.nagrade) ---- */
function showWheel(entry,done){
  if($('#wheelModal')) return;
  const avail=availablePrizes(), prizes=avail.map(p=>p.ime), N=prizes.length; if(!N){ done&&done(); return; }
  if(G) G.hold=true;
  const S=Math.round(Math.max(280,Math.min(innerHeight*.54,innerWidth*.86,520))), dpr=Math.min(2,window.devicePixelRatio||1);
  const m=document.createElement('div'); m.id='wheelModal';
  m.style.cssText='position:fixed;inset:0;z-index:45;background:rgba(2,6,15,.82);display:flex;align-items:center;justify-content:center';
  m.innerHTML=`<div class="px" style="position:relative;padding:30px 30px 22px;text-align:center;max-width:96vw"><span class="chip tagc">Kolo sreče</span>
    <div id="wtitle" style="font-size:30px;margin:2px 0 14px">Čestitamo! Zavrti kolo za nagrado.</div>
    <div class="wheelwrap" style="width:${S}px;height:${S}px"><div class="ptr"></div><canvas id="wheel" width="${Math.round(S*dpr)}" height="${Math.round(S*dpr)}" style="width:${S}px;height:${S}px"></canvas></div>
    <div id="wres" class="wres">&nbsp;</div>
    <button class="btn gold" id="wSpin" style="margin-right:0">Zavrti!</button><button class="btn" id="wClose" style="display:none">Naprej ▶</button></div>`;
  document.body.appendChild(m);
  const cvs=$('#wheel'), c=cvs.getContext('2d'); c.scale(dpr,dpr);
  const COLS=['#38e1ff','#ffd86b','#ff4f8b','#34d399','#a78bfa','#fb923c'], TAU=Math.PI*2, R=S/2-14;
  const slots=[]; while(slots.length<8){ for(let i=0;i<N;i++) slots.push(i); }      // kolo ima vedno vsaj 8 polj (nagrade se po potrebi ponovijo)
  const SN=slots.length, seg=TAU/SN;
  let theta=Math.random()*TAU, winIdx=-1, shown=-1, anim=null, lastIdx=-1, raf=0, spun=false;
  const draw=now=>{
    c.clearRect(0,0,S,S); c.save(); c.translate(S/2,S/2);
    c.beginPath(); c.arc(0,0,R+12,0,TAU); c.fillStyle='#fff'; c.fill();
    c.beginPath(); c.arc(0,0,R+7,0,TAU); c.fillStyle='#0b1530'; c.fill();
    c.save(); c.rotate(theta);
    for(let i=0;i<SN;i++){
      const a0=i*seg-Math.PI/2, a1=a0+seg, label=prizes[slots[i]];
      c.beginPath(); c.moveTo(0,0); c.arc(0,0,R,a0,a1); c.closePath(); c.fillStyle=COLS[i%COLS.length]; c.fill(); c.lineWidth=3; c.strokeStyle='#0b1530'; c.stroke();
      if(i===shown){ c.save(); c.globalAlpha=.25+.35*(Math.sin(now/110)*.5+.5); c.fillStyle='#fff'; c.beginPath(); c.moveTo(0,0); c.arc(0,0,R,a0,a1); c.closePath(); c.fill(); c.restore(); }
      c.save(); c.rotate(a0+seg/2); c.textAlign='right'; c.textBaseline='middle'; c.fillStyle='#04121f';
      let fs=Math.round(S*.075); c.font=fs+'px VT323, monospace'; while(c.measureText(label).width>R*.6&&fs>12){ fs--; c.font=fs+'px VT323, monospace'; }
      c.fillText(label,R-16,0); c.restore();
    }
    c.restore();
    for(let k=0;k<SN*2;k++){ const a=k*Math.PI/SN, on=((k+Math.floor(now/260))%2===0); c.beginPath(); c.arc(Math.cos(a)*(R+9.5),Math.sin(a)*(R+9.5),3.2,0,TAU); c.fillStyle=on?'#ffd86b':'#33466b'; c.fill(); }
    c.beginPath(); c.arc(0,0,S*.075,0,TAU); c.fillStyle='#0b1530'; c.fill(); c.lineWidth=4; c.strokeStyle='#fff'; c.stroke();
    c.fillStyle='#ffd86b'; c.font=Math.round(S*.05)+'px Silkscreen, monospace'; c.textAlign='center'; c.textBaseline='middle'; c.fillText('LIVE',0,1);
    c.restore();
  };
  const loop=now=>{
    if(!document.body.contains(m)) return;
    if(anim){
      const k=Math.min(1,(now-anim.t0)/anim.dur), e=1-Math.pow(1-k,4);        // gladko pojemanje (easeOutQuart)
      theta=anim.from+(anim.to-anim.from)*e;
      const idx=Math.floor((((-theta)%TAU)+TAU)%TAU/seg); if(idx!==lastIdx){ lastIdx=idx; sfx.tick(); }
      if(k>=1){ anim=null; stopped(); }
    }
    draw(now); raf=requestAnimationFrame(loop);
  };
  const spin=()=>{
    if(anim||spun) return;
    $('#wSpin').disabled=true; $('#wtitle').textContent='Vrtimo …'; sfx.start();
    const wts=avail.map(p=>p.teza||1); let r=Math.random()*wts.reduce((a,b)=>a+b,0), k=0; while(k<N-1&&r>=wts[k]){ r-=wts[k]; k++; }   // izžreba se glede na težo (redke nagrade redkeje)
    const j=Math.random()*.7-.35;                                               // nagrada je izžrebana vnaprej, kolo se ustavi nanjo
    const opts=[]; slots.forEach((p,i)=>{ if(p===k) opts.push(i); }); const s=opts[Math.floor(Math.random()*opts.length)];   // eno izmed polj te nagrade
    const target=(((-(s+.5+j)*seg)%TAU)+TAU)%TAU, cur=((theta%TAU)+TAU)%TAU, delta=(target-cur+TAU)%TAU;
    winIdx=s; lastIdx=-1; anim={ from:theta, to:theta+(6+Math.floor(Math.random()*3))*TAU+delta, t0:performance.now(), dur:5800 };
  };
  const close=()=>{ cancelAnimationFrame(raf); m.remove(); if(G) G.hold=false; if(spun&&done) done(); };
  const stopped=()=>{
    spun=true; shown=winIdx; const prize=prizes[slots[winIdx]]; takePrize(avail[slots[winIdx]]); entry.prize=prize; saveHighs(); if(G) G.prize=prize;
    $('#wtitle').textContent='Čestitamo!'; $('#wres').innerHTML='Osvojil/a si: <b>'+esc(prize)+'</b>';
    $('#wSpin').style.display='none'; $('#wClose').style.display=''; $('#wClose').focus();
    sfx.fanfare(); const r=cvs.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,140); burst(r.left+r.width*.2,r.top+r.height*.3,60); burst(r.left+r.width*.8,r.top+r.height*.3,60);
    const pb=$('#prizeBanner'); if(pb) pb.textContent='🎁 Nagrada: '+prize; const so=$('#spinOpen'); if(so) so.remove();
    later(()=>{ if(document.body.contains(m)) close(); },25000);
  };
  $('#wSpin').onclick=spin; $('#wClose').onclick=close; $('#wSpin').focus();
  m.addEventListener('keydown',e=>{ e.stopPropagation(); });
  later(()=>{ if(!spun&&document.body.contains(m)){ cancelAnimationFrame(raf); m.remove(); lastName=''; selCat=null; showStart(); } },60000);   // nihče ne vrti -> nazaj na začetek
  raf=requestAnimationFrame(loop);
}

  const inp=$('#codeIn'); inp.focus();
  const close=()=>m.remove();
  const ok=()=>{ if(inp.value.trim().toLowerCase()===RESET_CODE.toLowerCase()){ close(); onOk(); }
    else { $('#codeMsg').textContent='Napačna koda'; inp.value=''; inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.focus(); } };
  $('#codeOk').onclick=ok; $('#codeNo').onclick=close;
  inp.onkeydown=e=>{ e.stopPropagation(); if(e.key==='Enter') ok(); if(e.key==='Escape') close(); };
  m.addEventListener('keydown',e=>e.stopPropagation());
  m.onclick=e=>{ if(e.target===m) close(); };
}
$('#clr').onclick=()=>askCode('Ponastavitev lestvice','Vpiši kodo za izbris lestvice',()=>{ highs=[]; saveHighs(); if(!G) showStart(); });

/* ---- zaloga nagrad (za osebje) ---- */
function showStock(){
  if($('#stockModal')) return;
  const m=document.createElement('div'); m.id='stockModal';
  m.style.cssText='position:fixed;inset:0;z-index:48;background:rgba(2,6,15,.75);display:flex;align-items:center;justify-content:center';
  const sb='font-family:inherit;font-size:22px;width:34px;height:30px;line-height:1;cursor:pointer;border:2px solid #04121f;color:#04121f;flex:none';
  const rowsHtml=()=>PRIZES.map((p,i)=>{ const l=left(p); return `<li style="align-items:center;${l<=0?'opacity:.45':''}"><span class="n">${esc(p.ime)}</span><span class="d" style="min-width:86px;text-align:right">${l} / ${p.kolicina}</span><button data-i="${i}" data-d="-1" title="Odštej 1 (podeljeno na drugem prenosniku)" style="${sb};background:#ff4f8b">−</button><button data-i="${i}" data-d="1" title="Prištej 1 (popravek)" style="${sb};background:#38e1ff">+</button></li>`; }).join('');
  m.innerHTML=`<div class="px bd" style="position:relative;padding:30px 26px 20px;width:min(520px,94vw);text-align:center"><span class="chip tagc">Zaloga nagrad</span>
    <ol id="stList" style="margin:6px 0 10px">${rowsHtml()}</ol>
    <div style="font-size:17px;color:var(--dim);margin-bottom:6px">− odšteje eno nagrado (npr. podeljeno na drugem prenosniku), + jo vrne. Ostane / skupaj. Čas dogodka: ${evStart?(progress()*evHours()).toFixed(1)+' h od '+evHours()+' h':'se še ni začel'}. Redke nagrade se razporedijo čez cel dogodek.</div>
    <button class="btn" id="stClose">Zapri</button></div>`;
  document.body.appendChild(m);
  const close=()=>m.remove(); $('#stClose').onclick=close; m.onclick=e=>{ if(e.target===m) close(); };
  $('#stList').onclick=e=>{ const b=e.target.closest('button[data-i]'); if(!b) return; const p=PRIZES[+b.dataset.i]; stock[p.ime]=Math.max(0,Math.min(p.kolicina,left(p)+Number(b.dataset.d))); saveStock(); $('#stList').innerHTML=rowsHtml(); sfx.tick(); };   // posamezna nagrada: −1 / +1 m.addEventListener('keydown',e=>{ e.stopPropagation(); if(e.key==='Escape') close(); });
  // celotne ponastavitve ni več: zaloga se spreminja samo z −/+ pri posamezni nagradi
  $('#stClose').focus();
}
$('#stockBtn').onclick=showStock;
document.addEventListener('visibilitychange',()=>{ if(!actx) return; if(document.hidden) actx.suspend(); else actx.resume(); });
(document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>{});
showStart();
</script>
